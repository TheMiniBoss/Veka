name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust (version de rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Mesure du temps par image (.vk, affichée sans seuil)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo test -p veka --test mesure -- --ignored --nocapture
          cargo test -p veka --release --test mesure -- --ignored --nocapture
      - name: Exemple (sans fenêtre)
        run: cargo run --example compteur_sans_fenetre
      - name: Exemple fenêtré (une image puis fermeture)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: cargo run --example compteur
      - name: Fenêtre personnalisée (une image puis fermeture)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: cargo run --example fenetre_perso
      - name: Exemple fenêtre transparente (Windows)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: cargo run --example fenetre_transparente
      - name: Exemple colora (Windows)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: cargo run --example colora
      - name: Exemple anima (Windows)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: cargo run --example anima
      - name: Exemple verre (Windows)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: |
          cargo run --example verre
          cargo run --example verre -- mica
      - name: Exemple fusion (Windows)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: |
          cargo run --example fusion
          cargo run --example clavier
          cargo run --example formulaire
          cargo run --example liste
      - name: Exemples .vk (Windows)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: |
          cargo run --example vk -- compteur
          cargo run --example vk -- colora
          cargo run --example vk -- anima
          cargo run --example vk -- verre
          cargo run --example vk -- fusion
          cargo run --example vk -- clavier
          cargo run --example vk -- formulaire
          cargo run --example vk -- liste
      - name: Exemple C (CMake)
        run: |
          cmake -S examples/c -B build/c
          cmake --build build/c
      - name: Exemple C (une image puis fermeture)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: build/c/Debug/compteur.exe
      - name: Fenêtre personnalisée en C (une image puis fermeture)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: build/c/Debug/fenetre_perso.exe
      - name: Colora en C (une image puis fermeture)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: build/c/Debug/colora.exe
      - name: Anima en C (une image puis fermeture)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: build/c/Debug/anima.exe
      - name: Boutique .vk en C (une image puis fermeture)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: build/c/Debug/boutique.exe
      - name: Verre en C (une image puis fermeture)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: build/c/Debug/verre.exe
      - name: Fusion en C (une image puis fermeture)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: build/c/Debug/fusion.exe
      - name: Formulaire en C (une image puis fermeture)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: build/c/Debug/formulaire.exe
      - name: Liste en C (une image puis fermeture)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: build/c/Debug/liste.exe

  core:
    name: Cœur sans OS + WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (version de rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-core
      - name: veka.h à jour
        run: cargo xtask header --check
