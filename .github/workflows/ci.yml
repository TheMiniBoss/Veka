name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust (version de rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Exemple (sans fenêtre)
        run: cargo run --example compteur_sans_fenetre
      - name: Exemple fenêtré (une image puis fermeture)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: cargo run --example compteur
      - name: Exemple C (CMake)
        run: |
          cmake -S examples/c -B build/c
          cmake --build build/c
      - name: Exemple C (une image puis fermeture)
        if: matrix.os == 'windows-latest'
        env:
          VEKA_EXIT_AFTER_FIRST_FRAME: "1"
        run: build/c/Debug/compteur.exe

  core:
    name: Cœur sans OS + WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (version de rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check-core
      - name: veka.h à jour
        run: cargo xtask header --check
