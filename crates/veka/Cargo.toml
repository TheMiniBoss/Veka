[package]
name = "veka"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
description = "Veka : bibliothèque d'interface utilisateur pour Windows et macOS, utilisable partout."

[dependencies]
veka-foundation.workspace = true
veka-graphics.workspace = true
veka-text.workspace = true
veka-ui.workspace = true
veka-lang.workspace = true
veka-app = { workspace = true, optional = true }

[features]
default = ["app"]
# Les fenêtres natives (`App`). Sans elle, Veka n'a que le cœur, sans aucun appel au système.
app = ["dep:veka-app"]

[lints]
workspace = true
